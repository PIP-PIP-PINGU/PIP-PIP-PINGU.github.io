<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP | PIP-PIP-PINGU</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo"><a href="/matcha/">PIP-PIP-PINGU</a></div>
        
        <button class="hamburger-btn" onclick="toggleMenu()"><span></span><span></span><span></span></button>
        
        <ul id="navMenu">
            <li><a href="/map/">座標一覧</a></li>
            <li><a href="/bbs/" class="nav-disabled">掲示板</a></li>
            <li><a href="/farm/" class="nav-disabled">装置一覧</a></li>
            <li><a href="/trade/" class="nav-disabled">取引検索</a></li>
            <li><a href="/storage/" class="nav-disabled">倉庫検索</a></li>
        </ul>
    </nav>

    <div class="main-container">

        <header class="page-header">
            <h1>Location Map</h1>
        </header>

        <div class="map-container">
            <canvas id="mapCanvas" width="750" height="350"></canvas>
            <div class="info-popup" id="infoPopup"></div>
        </div>

        <div class="controls">

            <select id="categoryFilter">
                <option value="all">すべて</option>
                <option value="構造物">構造物</option>
                <option value="バイオーム">バイオーム</option>
                <option value="拠点">拠点</option>
                <option value="その他">その他</option>
            </select>
            <input type="text" id="searchInput" placeholder="検索...">
        </div>

        <ul class="location-list" id="listContainer"></ul>

    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 PIP-PIP-PINGU</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="../script.js"></script>

</body>
</html>
